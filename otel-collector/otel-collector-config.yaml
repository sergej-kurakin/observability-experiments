  # zipkin:
  #   endpoint: 0.0.0.0:9411

processors: 
  batch:

exporters:
  # debug:
  #   verbosity: detailed
  otlp/apm: 
    endpoint: "${env:APMSERVER_HOST}:${env:APMSERVER_PORT}"
    tls:
      insecure: true
    headers:
      Authorization: "Bearer ${env:ELASTIC_APM_SECRET_TOKEN}"
  otlp/tempo:
    endpoint: "http://tempo:4317"
    tls:
      insecure: true

service:

  pipelines:

    traces:
      # receivers: [otlp, opencensus, jaeger, zipkin]
      receivers: [otlp]
      processors: [batch]
      # exporters: [debug]
      exporters: [otlp/apm,otlp/tempo]

    # metrics:
    #   receivers: [otlp, opencensus, prometheus]
    #   processors: [batch]
    #   exporters: [debug]

    # logs:
    #   receivers: [otlp]
    #   processors: [batch]
    #   exporters: [debug]

  # extensions: [health_check, pprof, zpages]
  extensions: [health_check]
